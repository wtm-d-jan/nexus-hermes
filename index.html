<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEXUS HERMES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Arbeitswerkzeug: dunkelblaue Kopfleiste wie im Prototyp, darunter Karten in Lesebreite; Status über Farbflächen. */
:root{
  --bg:#f3f6f9;--card:#fff;--soft:#f8fafc;--ink:#18242f;--quiet:#5a6878;--line:#dbe2ea;--field:#fff;--fieldline:#c5cfda;
  --head:#12263a;--headink:#fff;--headquiet:#b9cde2;--headfield:#1e3a55;
  --acc:#0b5cab;--accink:#fff;--acc2:#e6f0fb;
  --red:#c62828;--redbg:#fdecea;--green:#2e7d32;--greenbg:#e3f3e4;--amber:#9a5b00;--amberbg:#fff1dc;
  --violet:#5e35b1;--violetbg:#f0eafb;--teal:#00695c;--tealbg:#e0f2f1;--tealline:#80cbc4;
  --f-text:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-head:'Barlow Semi Condensed','Source Sans 3',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1720;--card:#16212d;--soft:#1a2633;--ink:#e3eaf2;--quiet:#9aabbd;--line:#2c3b4b;--field:#101a24;--fieldline:#3a4b5e;
  --head:#0a1723;--headink:#fff;--headquiet:#9fb7cf;--headfield:#1b3148;
  --acc:#5ba4f0;--accink:#0b1a28;--acc2:#1a3048;
  --red:#ef7b73;--redbg:#3a1f1e;--green:#7cc983;--greenbg:#1d3322;--amber:#f0b45c;--amberbg:#3a2c16;
  --violet:#b39ae8;--violetbg:#2a2140;--teal:#6fd0c3;--tealbg:#16302d;--tealline:#2f6d65;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1720;--card:#16212d;--soft:#1a2633;--ink:#e3eaf2;--quiet:#9aabbd;--line:#2c3b4b;--field:#101a24;--fieldline:#3a4b5e;
  --head:#0a1723;--headink:#fff;--headquiet:#9fb7cf;--headfield:#1b3148;
  --acc:#5ba4f0;--accink:#0b1a28;--acc2:#1a3048;
  --red:#ef7b73;--redbg:#3a1f1e;--green:#7cc983;--greenbg:#1d3322;--amber:#f0b45c;--amberbg:#3a2c16;
  --violet:#b39ae8;--violetbg:#2a2140;--teal:#6fd0c3;--tealbg:#16302d;--tealline:#2f6d65;color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-text)}
.login{max-width:420px;margin:8vh auto 0;display:grid;gap:12px}
.login input{width:100%}
header .aus{background:transparent;border:1px solid var(--headquiet);color:var(--headink);border-radius:6px;font:inherit;font-size:12.5px;padding:3px 8px;cursor:pointer}
.konten td{vertical-align:middle}
header{background:var(--head);color:var(--headink);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap}
header h1{font:700 19px/1.1 var(--f-head);letter-spacing:.03em;margin:0}

nav{display:flex;gap:4px;flex-wrap:wrap}

nav .zahl{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--headfield);color:var(--headink);font-size:12px;text-align:center}

.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--headquiet);flex-wrap:wrap}
.who b{color:var(--headink)}
.who select{background:var(--headfield);color:var(--headink);border:1px solid var(--headquiet);font-size:13px;padding:3px 6px}
#save{font-size:12px;color:var(--headquiet);width:100%;text-align:right;min-height:15px}
main{max-width:1150px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
h2{font:600 19px/1.2 var(--f-head);margin:0 0 12px;text-wrap:balance}
h3{font:600 16px/1.2 var(--f-head);margin:0 0 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.between{justify-content:space-between;align-items:center}
label{display:flex;flex-direction:column;font-size:12.5px;color:var(--quiet);gap:3px}
label.cb{flex-direction:row;align-items:center;gap:6px;font-size:14px;color:var(--ink)}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);border:1px solid var(--fieldline);border-radius:6px;padding:6px 8px;background:var(--field);max-width:100%}
input:disabled,select:disabled,textarea:disabled{background:var(--soft);color:var(--ink);opacity:1}
textarea{min-height:60px;resize:vertical;width:100%}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.b{font:inherit;font-size:14px;border:1px solid var(--acc);background:var(--acc);color:var(--accink);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:600}
button.g{font:inherit;font-size:14px;border:1px solid var(--fieldline);background:var(--card);color:var(--ink);border-radius:6px;padding:5px 10px;cursor:pointer}
button.g:hover{border-color:var(--acc);color:var(--acc)}
button.k{font-size:12.5px;padding:2px 8px}
button.x{border:0;background:none;color:var(--quiet);cursor:pointer;font-size:17px;line-height:1;padding:0 4px}
button.x:hover{color:var(--red)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--quiet);font-weight:600}
tr.click{cursor:pointer}tr.click:hover td{background:var(--acc2)}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--acc2);color:var(--acc);white-space:nowrap}
.p-offen,.p-geplant{background:var(--soft);color:var(--quiet);border:1px solid var(--line)}
.p-inarbeit,.p-laeuft{background:var(--amberbg);color:var(--amber)}
.p-erledigt,.p-abgeschlossen{background:var(--greenbg);color:var(--green)}
.p-vertr{background:var(--violetbg);color:var(--violet)}
.p-vp{background:var(--tealbg);color:var(--teal);border:1px solid var(--tealline)}
select.s-inarbeit{background:var(--amberbg)}select.s-erledigt{background:var(--greenbg)}
.over{color:var(--red);font-weight:600}
.muted{color:var(--quiet)}
.note{font-size:13px;color:var(--quiet)}
.stat{display:flex;gap:12px;flex-wrap:wrap}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:150px;flex:1 1 150px}
.stat b{display:block;font:700 26px/1.1 var(--f-head);font-variant-numeric:tabular-nums}
.info{background:var(--acc2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.warn{background:var(--amberbg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.fehler{background:var(--redbg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.fehler ul,.warn ul{margin:6px 0 0;padding-left:20px}
.topic{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px;background:var(--soft)}
.topic-h{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.topic-h input{flex:1;font-weight:600;min-width:0}
.sub{font-size:12px;font-weight:600;color:var(--quiet);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.06em}
.sub span{text-transform:none;letter-spacing:0;font-weight:400}
.task{display:grid;grid-template-columns:minmax(0,1fr) 180px 140px 115px 24px;gap:6px;margin-bottom:4px;align-items:center}
.task.t-inarbeit,.task.t-erledigt{border-radius:6px;padding:4px}
.task.t-inarbeit{background:var(--amberbg)}.task.t-erledigt{background:var(--greenbg)}
.meta{font-size:12.5px;color:var(--quiet);margin:0 0 8px 4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dec{display:flex;gap:6px;margin-bottom:5px}.dec input{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);border-radius:14px;padding:3px 10px;user-select:none;background:var(--card);font-size:14px}
.chip[data-tn]{cursor:pointer}
.chip.on{background:var(--greenbg);border-color:var(--green)}
.chip.ex{background:var(--amberbg);border-color:var(--amber)}
.fchip{cursor:pointer}.fchip.on{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.mitc{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:0 6px;color:var(--ink)}
.carry{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.private{background:var(--violetbg);border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:4px}
.private h3{color:var(--violet)}
.prep{background:var(--card);border:2px solid var(--tealline);border-radius:10px;padding:14px 16px}
.prep h2{color:var(--teal)}
.vp{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px;margin-bottom:8px}
.vp.vp-open{background:var(--tealbg);border-color:var(--tealline)}.vp.vp-done{color:var(--quiet)}
.vp-h{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}.vp-h input{flex:1;font-weight:600;min-width:0}
pre{white-space:pre-wrap;font:13px/1.5 ui-monospace,Consolas,monospace;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:14px;max-height:520px;overflow:auto;margin:10px 0}
.thr{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:4px 0 10px}
.thr-e{border-left:3px solid var(--line);padding:4px 10px;margin-bottom:8px}
.thr-me{border-left-color:var(--acc)}
.thr-sys{color:var(--quiet);font-size:13px;font-style:italic}
.thr-imgs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.thr-imgs img{height:90px;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}
.pimg{position:relative}.pimg .x{position:absolute;top:0;right:0;background:var(--card);border-radius:10px}
button.thr-new{border-color:var(--acc);color:var(--acc);font-weight:600}
.drop{display:flex;align-items:center;justify-content:center;border:2px dashed var(--fieldline);border-radius:8px;padding:10px 14px;color:var(--quiet);font-size:13.5px;cursor:pointer;flex:1;min-width:220px}
.drop:hover,.drop.over{border-color:var(--acc);color:var(--acc);background:var(--acc2)}
.drop input{display:none}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:9;cursor:zoom-out;padding:16px}
#lb img{max-width:94vw;max-height:90vh;border-radius:6px}
.dept{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.ma{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 6px;padding:8px 0;border-bottom:1px solid var(--line)}
.ma:last-child{border-bottom:0}.ma .voll{grid-column:1/-1}
.ma select,.ma input{font-size:13px;padding:3px 6px;min-width:0;width:100%}
.konto{font-size:12px}.konto.ok{color:var(--green)}
.leer{padding:28px 18px;text-align:center;color:var(--quiet)}
.leer h2{color:var(--ink)}
@media (max-width:760px){.task{grid-template-columns:1fr 1fr}.task>input:first-child{grid-column:1/-1}.task .x{justify-self:end}.who{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<body>
<div id="root"><main><div class="card leer"><h2>NEXUS HERMES</h2><p>Besprechungen und Aufgaben werden geladen …</p></div></main></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.js"></script>
<script src="config.js" charset="utf-8"></script>
<script src="logik.js" charset="utf-8"></script>
<script src="speicher.js" charset="utf-8"></script>
<script>
(function(){
'use strict';
var L=window.HermesLogik;

/* ---------- Zustand ---------- */
var st={stamm:undefined,konten:{},bsp:{},geheim:{},aufg:{},vorschl:{},notizen:{}};
var env={db:null,user:null,assets:null,uid:null,admin:false,bereit:false,keinDb:false,langsam:false};
var ui={view:'liste',cur:null,fArt:'alle',fAbt:'alle',fBst:'alle',fSt:'aktiv',vorschau:null,openThr:{},drafts:{},pend:{},showProt:{},abschluss:{},status:'',spaeter:false};

/* ---------- Hilfen ---------- */
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function heute(){return L.isoTag()}
function jetzt(){var d=new Date();return heute()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function nm(id){return L.name(st.stamm,id)}
function kzB(id){var n=nm(id);return '<b title="'+esc(n)+'">'+esc(L.kz(n))+'</b>'}
function vals(o){return Object.keys(o).map(function(k){return o[k]})}
function alleBsp(){return vals(st.bsp).concat(vals(st.geheim))}
function alleAufg(){return vals(st.aufg)}
function findB(id){return st.bsp[id]||st.geheim[id]||null}
function pfadB(b){return (b.vertraulich?'geheim/':'besprechungen/')+b.id}
function meinMa(){var k=env.uid&&st.konten[env.uid];return k&&k.ma&&L.ma(st.stamm,k.ma)?k.ma:null}
function ctx(){return ui.vorschau?{me:ui.vorschau,admin:false,stamm:st.stamm}:{me:meinMa(),admin:env.admin,stamm:st.stamm}}
function leiter(){return L.darf(ctx(),'anlegen')}
function pill(s){return '<span class="pill p-'+s+'">'+L.stLabel(s)+'</span>'}
function setStatus(t){ui.status=t;var el=$('#save');if(el)el.textContent=t}

/* ---------- Speichern: je Dokument eins nach dem anderen, Tippen wird gebündelt ---------- */
var Q={};
function pending(p){return !!Q[p]}
function speichern(p,data,sofort){
  if(ui.vorschau){setStatus('Vorschau: hier wird nichts gespeichert');return}
  var q=Q[p]||(Q[p]={});q.data=L.kopie(data);q.del=false;clearTimeout(q.t);
  q.t=setTimeout(function(){flush(p)},sofort?0:700);setStatus('Wird gespeichert …');
}
function loeschen(p){
  if(ui.vorschau)return;
  var q=Q[p]||(Q[p]={});q.data=undefined;q.del=true;clearTimeout(q.t);flush(p);
}
function flush(p){
  var q=Q[p];if(!q||q.busy)return;
  if(q.data===undefined&&!q.del){delete Q[p];return}
  var d=q.data,del=q.del;q.data=undefined;q.del=false;q.busy=true;
  var ref=env.db.doc(p);
  (del?ref.delete():ref.set(d)).then(function(){
    q.busy=false;q.fails=0;
    if(q.data!==undefined||q.del)flush(p);else{delete Q[p];if(!Object.keys(Q).length)setStatus('Gespeichert')}
  },function(e){
    q.busy=false;var c=e&&e.code;
    if(c==='unavailable'&&!(q.fails>0)){q.fails=1;if(q.data===undefined&&!q.del){q.data=d;q.del=del}setTimeout(function(){flush(p)},800+Math.random()*800);return}
    delete Q[p];
    setStatus(c==='invalid_argument'?'Nicht gespeichert: dafür fehlen dir die Rechte':c==='quota_exceeded'?'Nicht gespeichert: der Speicher ist voll':'Nicht gespeichert, bitte nochmal versuchen');
    neuZeichnen();
  });
}

/* ---------- Laden ---------- */
function abo(coll,key){
  env.db.collection(coll).onSnapshot(function(s){
    var m={};
    s.docs.forEach(function(d){var p=coll+'/'+d.id;m[d.id]=(pending(p)&&st[key][d.id])?st[key][d.id]:L.kopie(d.data())});
    Object.keys(st[key]).forEach(function(id){var q=Q[coll+'/'+id];if(!m[id]&&q&&!q.del)m[id]=st[key][id]});
    st[key]=m;neuZeichnen();
  },function(){});
}
/* Anmeldung über Supabase: E-Mail und Passwort. Neue Konten gibt ein Admin frei. */
function start(){
  if(!window.supabase||!window.HERMES_CONFIG){env.keinDb=true;render();return}
  env.sb=window.supabase.createClient(HERMES_CONFIG.url,HERMES_CONFIG.key);
  env.sb.auth.onAuthStateChange(function(ev){if(ev==='SIGNED_OUT')location.reload()});
  env.sb.auth.getSession().then(function(r){
    var s=r.data&&r.data.session;
    if(!s){env.login=true;render();return}
    env.uid=s.user.id;env.email=s.user.email;
    return meinKonto().then(function(k){
      if(!k.freigegeben){env.wartet=true;render();setTimeout(function(){location.reload()},30000);return}
      env.admin=!!k.admin;daten();
    });
  }).catch(function(){env.keinDb=true;render()});
}
function meinKonto(){
  return env.sb.from('konten').select('uid,ma,freigegeben,admin').eq('uid',env.uid).maybeSingle().then(function(r){
    if(r.error)throw r.error;if(r.data)return r.data;
    return env.sb.from('konten').insert({}).select('uid,ma,freigegeben,admin').single().then(function(r2){if(r2.error)throw r2.error;return r2.data});
  });
}
function daten(){
  env.db=HermesSpeicher.Speicher(env.sb);env.assets=HermesSpeicher.Fotos(env.sb,env.uid);
  var timer=setTimeout(function(){if(st.stamm===undefined){env.langsam=true;render()}},10000);
  env.db.doc('stamm/main').onSnapshot(function(d){
    clearTimeout(timer);env.langsam=false;
    if(!pending('stamm/main'))st.stamm=d.exists?L.kopie(d.data()):null;neuZeichnen();
  },function(){clearTimeout(timer);env.langsam=true;render()});
  abo('konten','konten');abo('besprechungen','bsp');abo('aufgaben','aufg');abo('vorschlaege','vorschl');
  if(env.admin)abo('geheim','geheim');
  abo('data/users/'+env.uid,'notizen');
}
function vLogin(){
  return '<main><form class="card login" id="login" autocomplete="on"><h2 style="margin:0">NEXUS HERMES</h2><p class="muted" style="margin:0">Besprechungen und Aufgaben. Melde dich mit deiner E-Mail an. Beim ersten Mal legst du ein Konto an, die Geschäftsführung gibt es dann frei.</p>'+
    '<label>E-Mail<input id="l-mail" type="email" autocomplete="username" required></label>'+
    '<label>Passwort (mindestens 8 Zeichen)<input id="l-pw" type="password" autocomplete="current-password" minlength="8" required></label>'+
    '<div class="row"><button class="b" type="submit">Anmelden</button><button class="g" type="button" data-act="registrieren">Konto anlegen</button></div>'+
    '<p id="l-msg" class="note" style="margin:0">'+esc(ui.status)+'</p><p class="note" style="margin:0">Passwort vergessen? Sag der Geschäftsführung Bescheid.</p></form></main>';
}
function vWarten(){
  return '<main><div class="card leer"><h2>Konto wartet auf Freigabe</h2><p>Du bist als <b>'+esc(env.email)+'</b> angemeldet. Die Geschäftsführung muss dein Konto einmal freigeben. Die Seite prüft das alle 30 Sekunden von selbst.</p><p><button class="g" data-act="abmelden">Abmelden</button></p></div></main>';
}
function loginMeldung(t){ui.status=t;var m=$('#l-msg');if(m)m.textContent=t}
document.addEventListener('submit',function(e){
  if(e.target.id!=='login')return;e.preventDefault();
  loginMeldung('Anmeldung läuft …');
  env.sb.auth.signInWithPassword({email:$('#l-mail').value.trim(),password:$('#l-pw').value}).then(function(r){
    if(r.error){loginMeldung(/confirm/i.test(r.error.message)?'Bitte erst den Link in der Bestätigungs-Mail öffnen.':'E-Mail oder Passwort stimmen nicht.');return}
    location.reload();
  });
});

/* Nicht neu zeichnen, während jemand tippt: sonst springt der Cursor. */
function tippt(){var a=document.activeElement;return !!(a&&a.closest&&a.closest('#root')&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))}
function neuZeichnen(){if(tippt())ui.spaeter=true;else render()}
document.addEventListener('focusout',function(){setTimeout(function(){if(ui.spaeter&&!tippt()){ui.spaeter=false;render()}},250)});

/* ---------- Navigation über #hash ---------- */
function ausHash(){var h=(location.hash||'').slice(1);if(/^b-[a-z0-9]+$/.test(h)){ui.cur=h.slice(2);ui.view='detail'}else if(['liste','aufgaben','meine','team','rollen'].indexOf(h)>=0)ui.view=h}
window.addEventListener('hashchange',function(){ausHash();render()});
function hashSetzen(){try{var h=ui.view==='detail'?'b-'+ui.cur:ui.view;if(location.hash.slice(1)!==h)history.replaceState(null,'','#'+h)}catch(e){}}

/* ---------- Zeichnen ---------- */
function render(){
  var h='';
  if(env.keinDb)h=leer('Keine Verbindung','Die Datenbank ist gerade nicht erreichbar. Prüfe die Internetverbindung und lade die Seite neu.');
  else if(env.login)h=vLogin();
  else if(env.wartet)h=vWarten();
  else if(st.stamm===undefined)h=env.langsam?leer('Daten noch nicht erreichbar','Die Verbindung zur Datenbank antwortet nicht. Prüfe die Internetverbindung, die Seite lädt dann von selbst nach.'):leer('NEXUS HERMES','Besprechungen und Aufgaben werden geladen …');
  else if(st.stamm===null)h=vEinrichten();
  else{
    var c=ctx();
    if(!c.me&&!ui.vorschau&&!(env.admin&&(ui.view==='team'||ui.view==='rollen')))h=kopf()+'<main>'+vAnmelden()+'</main>';
    else{
      if((ui.view==='team'||ui.view==='rollen')&&!c.admin)ui.view='liste';
      if(ui.view==='detail'&&!(findB(ui.cur)&&L.kannSehen(findB(ui.cur),c)))ui.view='liste';
      hashSetzen();
      h=kopf()+'<main>'+(ui.vorschau?'<div class="warn">Vorschau: du siehst die App so wie <b>'+esc(nm(ui.vorschau))+'</b>. Hier wird nichts gespeichert.</div>':'')+
        ({liste:vListe,detail:vDetail,aufgaben:vAufgaben,meine:vMeine,team:vTeam,rollen:vRollen}[ui.view]||vListe)()+'</main>';
    }
  }
  $('#root').innerHTML=h;
}
function leer(t,p){return '<main><div class="card leer"><h2>'+esc(t)+'</h2><p>'+esc(p)+'</p></div></main>'}

function kopf(){
  var c=ctx(),z=c.me?L.zaehler(alleAufg(),c.me,heute()):{offen:0,ueberfaellig:0};
  var tabs=[['liste','Besprechungen'],['aufgaben',c.admin?'Alle Aufgaben':'Aufgaben'],['meine','Meine Aufgaben']];
  if(c.admin){tabs.push(['team','Team']);tabs.push(['rollen','Rollen'])}
  var h='<header><h1>NEXUS HERMES <span>Besprechungen und Aufgaben</span></h1><nav>'+tabs.map(function(t){
    var zahl=t[0]==='meine'&&z.offen?'<span class="zahl'+(z.ueberfaellig?' rot':'')+'" title="'+z.offen+' offen, '+z.ueberfaellig+' überfällig">'+z.offen+'</span>':'';
    return '<button data-nav="'+t[0]+'" class="'+(ui.view===t[0]||(ui.view==='detail'&&t[0]==='liste')?'on':'')+'">'+t[1]+zahl+'</button>'}).join('')+'</nav><div class="who">';
  var ich=meinMa();
  h+=ich?'Angemeldet als <b>'+esc(nm(ich))+'</b>':'Noch nicht zugeordnet';
  if(env.admin)h+='<select id="f-vorschau" title="Die App mit den Augen eines Mitarbeiters ansehen"><option value="">Vorschau als …</option>'+st.stamm.mitarbeiter.map(function(m){return '<option value="'+esc(m.id)+'"'+(ui.vorschau===m.id?' selected':'')+'>'+esc(m.name)+'</option>'}).join('')+'</select>';
  return h+'<button class="aus" data-act="abmelden">Abmelden</button></div><div id="save">'+esc(ui.status)+'</div></header>';
}

function optMa(sel,leer1,ids){
  ids=ids||st.stamm.mitarbeiter.map(function(m){return m.id});
  return (leer1?'<option value="">– wählen –</option>':'')+st.stamm.abteilungen.map(function(a){
    var ms=st.stamm.mitarbeiter.filter(function(m){return m.abt===a&&ids.indexOf(m.id)>=0});
    if(!ms.length)return '';
    return '<optgroup label="'+esc(a)+'">'+ms.map(function(m){return '<option value="'+esc(m.id)+'"'+(m.id===sel?' selected':'')+'>'+esc(m.name)+'</option>'}).join('')+'</optgroup>';
  }).join('')+(sel&&ids.indexOf(sel)<0?'<option value="'+esc(sel)+'" selected>'+esc(nm(sel))+'</option>':'');
}

/* ----- Einrichten und Anmelden ----- */
function vEinrichten(){
  if(!env.admin)return leer('Noch nicht eingerichtet','Die Geschäftsführung legt Abteilungen und Mitarbeiter an. Danach kannst du dich hier zuordnen.');
  return '<main><div class="card"><h2>NEXUS HERMES einrichten</h2><p>Es gibt noch keine Stammdaten. Sie werden mit den Standardvorlagen angelegt: vier Rollen (Geschäftsführer, Prokurist, Teamleiter, Mitarbeiter) und sechs Besprechungsarten. Alles lässt sich danach unter „Team“ und „Rollen“ ändern.</p>'+
    '<div style="display:grid;gap:10px"><label>Abteilungen, durch Komma getrennt<input id="e-abt" value="Geschäftsführung, Vertrieb, Büro, Service, Montage, Produktion"></label>'+
    '<label>Mitarbeiter, einer pro Zeile: Name; Abteilung; Rolle (gf, pk, tl oder ma, Trennung mit ; oder ,)<textarea id="e-ma" rows="8" placeholder="Erika Muster; Geschäftsführung; gf&#10;Max Beispiel; Vertrieb; tl&#10;Paula Probe; Service; ma"></textarea></label>'+
    '<div><button class="b" data-act="einrichten">Einrichten</button></div></div><p class="note">Danach wählt jeder beim ersten Öffnen einmal seinen Namen, du auch.</p></div></main>';
}
function vAnmelden(){
  var ko=L.kontenUebersicht(st.konten),frei=st.stamm.mitarbeiter.filter(function(m){return !ko.proMa[m.id]});
  var h='<div class="card"><h2>Wer bist du?</h2><p>Wähle einmal deinen Namen. Danach erkennt dich NEXUS HERMES an deiner Anmeldung, auf jedem Gerät.</p>';
  if(!env.uid)return h+'<p class="warn">Du bist nicht angemeldet. Lade die Seite neu.</p></div>';
  if(!frei.length)return h+'<p class="warn">Alle Namen sind schon vergeben. Bitte die Geschäftsführung, dich unter „Team“ anzulegen.</p></div>';
  return h+'<div class="row"><label>Name<select id="claim-ma">'+optMa('',true,frei.map(function(m){return m.id}))+'</select></label><button class="b" data-act="claim">Das bin ich</button></div><p class="note">Falsch gewählt? Ein Admin kann das unter „Team“ ändern.</p>'+(env.admin?'<p class="note">Als Admin kannst du auch erst unter <a href="#team">Team</a> die Mitarbeiter anlegen.</p>':'')+'</div>';
}

/* ----- Besprechungsliste ----- */
function vListe(){
  var c=ctx(),bs=alleBsp().filter(function(b){return L.kannSehen(b,c)}),sichtbar=bs.length;
  var meine=L.zaehler(alleAufg(),c.me,heute());
  var h='<div class="stat"><div><span class="muted">Besprechungen</span><b>'+bs.length+'</b></div><div><span class="muted">Meine offenen Aufgaben</span><b>'+meine.offen+'</b></div><div><span class="muted">Davon überfällig</span><b class="'+(meine.ueberfaellig?'over':'')+'">'+meine.ueberfaellig+'</b></div></div>';
  if(leiter()){
    var d=L.artDef(st.stamm,($('#n-art')&&$('#n-art').value)||st.stamm.arten[0].name);
    h+='<div class="card"><h2>Neue Besprechung oder Notiz</h2><div class="row">'+
      '<label>Art<select id="n-art">'+st.stamm.arten.map(function(a){return '<option'+(a.name===d.name?' selected':'')+'>'+esc(a.name)+'</option>'}).join('')+'</select></label>'+
      (d.tn==='abteilung'?'<label>Abteilung<select id="n-abt">'+st.stamm.abteilungen.map(function(a){return '<option>'+esc(a)+'</option>'}).join('')+'</select></label>':'')+
      (d.tn==='person'?'<label>Mit wem<select id="n-person">'+optMa('',false,st.stamm.mitarbeiter.filter(function(m){return m.id!==c.me}).map(function(m){return m.id}))+'</select></label>':'')+
      '<label>Titel<input id="n-titel" placeholder="optional, z. B. KW 48" size="20"></label>'+
      '<label>Datum<input id="n-datum" type="date" value="'+heute()+'"></label>'+
      (c.admin?'<label class="cb"><input type="checkbox" id="n-vert"'+(L.vertraulichVorbelegt(d)?' checked':'')+'> vertraulich</label>':'')+
      '<button class="b" data-act="neu">Anlegen</button></div><p class="note">'+
      ({teamleiter:'Alle Teamleiter werden automatisch eingetragen.',abteilung:'Alle Mitarbeiter der Abteilung werden automatisch eingetragen.',fest:'Teilnehmer: '+esc((d.fest||[]).map(nm).join(', ')||'noch niemand festgelegt')+'.',person:'Nur du und der gewählte Mitarbeiter.',frei:'Teilnehmer wählst du in der Besprechung aus.',keine:'Nur für dich. Aufgaben daraus kannst du trotzdem vergeben.'}[d.tn]||'')+
      (c.admin?' Vertraulich sehen nur Admins, zugewiesene Aufgaben sieht der Verantwortliche trotzdem.':'')+'</p></div>';
  }
  h+='<div class="card"><div class="row between" style="margin-bottom:10px"><h2 style="margin:0">'+(c.admin?'Alle Besprechungen und Notizen':'Meine Besprechungen')+'</h2><div class="row">'+
    '<label>Art<select id="f-art"><option>alle</option>'+st.stamm.arten.map(function(a){return '<option'+(a.name===ui.fArt?' selected':'')+'>'+esc(a.name)+'</option>'}).join('')+'</select></label>'+
    '<label>Abteilung<select id="f-abt"><option>alle</option>'+st.stamm.abteilungen.map(function(a){return '<option'+(a===ui.fAbt?' selected':'')+'>'+esc(a)+'</option>'}).join('')+'</select></label>'+
    '<label>Status<select id="f-bst">'+[['alle','alle'],['offen','geplant oder läuft'],['abgeschlossen','abgeschlossen']].map(function(o){return '<option value="'+o[0]+'"'+(o[0]===ui.fBst?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></label></div></div>';
  bs=bs.filter(function(b){
    return (ui.fBst==='alle'||(ui.fBst==='offen'?b.status!=='abgeschlossen':b.status===ui.fBst))&&(ui.fArt==='alle'||b.art===ui.fArt)&&
      (ui.fAbt==='alle'||b.abteilung===ui.fAbt||(!b.abteilung&&Object.keys(b.teilnehmer).some(function(id){var m=L.ma(st.stamm,id);return m&&m.abt===ui.fAbt})));
  });
  if(!bs.length)h+='<p class="muted">'+(sichtbar?'Keine Besprechung passt zum Filter.':(leiter()?'Noch keine Besprechungen. Lege oben die erste an.':'Noch keine Besprechungen, an denen du teilnimmst.'))+'</p>';
  else{
    var aufg=alleAufg(),vs=vals(st.vorschl);
    h+='<div class="tbl"><table><tr><th>Datum</th><th>Art</th><th>Titel</th><th>Teilnehmer</th><th>Aufgaben offen</th><th>Status</th></tr>';
    bs.sort(function(a,b){return a.datum<b.datum?1:a.datum>b.datum?-1:0}).forEach(function(b){
      var n=L.aufgabenDer(b,aufg).filter(function(a){return a.text&&a.status!=='erledigt'&&L.aufgabeSichtbar(a,c)}).length;
      var tn=Object.keys(b.teilnehmer).map(nm);
      var vp=vs.filter(function(v){return v.besprechung===b.id&&!v.uebernommen&&(v.titel||v.text)});
      var vpHint=leiter()?(vp.length?' <span class="pill p-vp">'+vp.length+' Punkte vorbereitet</span>':''):(b.status!=='abgeschlossen'?' <span class="pill p-vp">'+(vp.some(function(v){return v.von===c.me})?'Punkte eingetragen':'Punkte eintragen')+'</span>':'');
      h+='<tr class="click" data-open="'+b.id+'"><td>'+L.de(b.datum)+'</td><td>'+esc(b.art)+(b.abteilung?' <span class="muted">'+esc(b.abteilung)+'</span>':'')+'</td><td>'+esc(b.titel||'')+'</td><td class="note">'+esc(tn.length>4?tn.slice(0,4).join(', ')+' +'+(tn.length-4):tn.join(', '))+'</td><td>'+n+'</td><td>'+pill(b.status)+(b.vertraulich?' <span class="pill p-vertr">vertraulich</span>':'')+vpHint+'</td></tr>';
    });
    h+='</table></div>';
  }
  return h+'</div>';
}

/* ----- Besprechung ----- */
function vDetail(){
  var b=findB(ui.cur),c=ctx(),gf=leiter(),lock=b.status==='abgeschlossen'||!gf,dis=lock?' disabled':'',aufg=alleAufg();
  var h='<div class="card"><div class="row between" style="margin-bottom:12px"><h2 style="margin:0">'+esc(b.art)+(b.abteilung?' '+esc(b.abteilung):'')+' · '+L.de(b.datum)+(b.vertraulich?' <span class="pill p-vertr">vertraulich</span>':'')+'</h2><div class="row">'+
    '<button class="g" data-act="zurueck">← Liste</button><button class="g" data-act="protokoll">'+(ui.showProt[b.id]?'Protokoll ausblenden':'Protokoll')+'</button>'+
    (gf&&b.folgetermin&&!alleBsp().some(function(x){return x.vorgaenger===b.id})?'<button class="g" data-act="folge">Folgetermin '+L.de(b.folgetermin)+' anlegen</button>':'')+
    (gf?(b.status==='abgeschlossen'?'<button class="g" data-act="oeffnen">Wieder öffnen</button>':'<button class="b" data-act="abschliessen">Abschließen</button>'):'')+
    '</div></div><div class="row">'+
    '<label>Titel<input data-f="titel" value="'+esc(b.titel)+'" size="24"'+dis+'></label>'+
    '<label>Datum<input data-f="datum" type="date" value="'+esc(b.datum)+'"'+dis+'></label>'+
    '<label>Ort<input data-f="ort" value="'+esc(b.ort)+'" placeholder="Besprechungsraum" size="16"'+dis+'></label>'+
    '<label>Nächster Termin<input data-f="folgetermin" type="date" value="'+esc(b.folgetermin||'')+'"'+dis+'></label>'+
    (c.admin?'<label class="cb"><input type="checkbox" id="b-vert"'+(b.vertraulich?' checked':'')+(lock?' disabled':'')+'> vertraulich</label>':'')+
    '<label>Status<span>'+pill(b.status)+'</span></label></div>';
  var tn=Object.keys(b.teilnehmer);
  h+='<div class="sub">Teilnehmer '+(lock?'':'<span>· antippen: anwesend → entschuldigt → offen</span>')+'</div><div class="chips">'+
    tn.map(function(id){var s=b.teilnehmer[id];return '<span class="chip '+(s==='a'?'on':s==='e'?'ex':'')+'"'+(lock?'':' data-tn="'+esc(id)+'"')+'>'+esc(nm(id))+(s==='a'?' ✓':s==='e'?' (entsch.)':'')+(lock?'':' <button class="x" data-rm-tn="'+esc(id)+'" title="entfernen" aria-label="'+esc(nm(id))+' entfernen">×</button>')+'</span>'}).join('')+
    (lock?'':'<select id="add-tn"><option value="">+ Teilnehmer</option>'+optMa('',false,st.stamm.mitarbeiter.map(function(m){return m.id}).filter(function(id){return tn.indexOf(id)<0}))+'</select>')+'</div>';
  var ab=ui.abschluss[b.id];
  if(ab&&ab.fehler.length)h+='<div class="fehler" style="margin-top:12px"><b>Noch nicht abschließbar:</b><ul>'+ab.fehler.map(function(f){return '<li>'+esc(f)+'</li>'}).join('')+'</ul></div>';
  if(ab&&ab.hinweise.length&&!ab.fehler.length)h+='<div class="warn" style="margin-top:12px"><b>Abgeschlossen, aber bitte prüfen:</b><ul>'+ab.hinweise.map(function(f){return '<li>'+esc(f)+'</li>'}).join('')+'</ul></div>';
  h+='</div>';

  if(gf){
    var carry=L.offeneAusFrueheren(b,alleBsp(),aufg).filter(function(a){return L.aufgabeSichtbar(a,c)});
    if(carry.length)h+='<div class="carry"><h3>Offene Aufgaben aus früheren Runden ('+carry.length+')</h3>'+aufgabenTabelle(carry,true)+'</div>';
  }
  h+=vVorbereitung(b);
  h+='<div class="card"><h2>Themen</h2>';
  b.themen.forEach(function(t,i){
    var tasks=L.aufgabenDer(b,aufg).filter(function(a){return a.thema===t.id&&L.aufgabeSichtbar(a,c)});
    h+='<div class="topic"><div class="topic-h"><span class="muted">'+(i+1)+'.</span><input data-tf="titel" data-t="'+t.id+'" value="'+esc(t.titel)+'" placeholder="Thema" aria-label="Thema"'+dis+'>'+(lock?'':'<button class="x" title="Thema löschen" data-del-t="'+t.id+'">×</button>')+'</div>'+
      '<textarea data-tf="notiz" data-t="'+t.id+'" placeholder="Was wurde besprochen?" aria-label="Notizen"'+dis+'>'+esc(t.notiz)+'</textarea>'+
      ((t.beschluesse.length||!lock)?'<div class="sub">Beschlüsse</div>':'')+
      t.beschluesse.map(function(d){return '<div class="dec"><input data-dec="'+d.id+'" data-t="'+t.id+'" value="'+esc(d.text)+'" placeholder="Was wurde entschieden?" aria-label="Beschluss"'+dis+'>'+(lock?'':'<button class="x" data-del-d="'+d.id+'" data-t="'+t.id+'" title="Beschluss löschen">×</button>')+'</div>'}).join('')+
      (lock?'':'<button class="g k" data-add-d="'+t.id+'">+ Beschluss</button>')+
      ((tasks.length||!lock)?'<div class="sub">Aufgaben</div>':'')+
      tasks.map(function(a){return aufgabeZeile(a,lock)}).join('')+
      (lock?'':'<button class="g k" data-add-a="'+t.id+'">+ Aufgabe</button>')+'</div>';
  });
  if(!lock)h+='<button class="b" data-act="thema">+ Thema</button>';
  if(env.uid&&!ui.vorschau){var no=st.notizen['n-'+b.id];h+='<div class="private"><h3>Meine Notiz</h3><p class="note" style="margin:0 0 6px">Nur du siehst sie, auch die Geschäftsführung nicht. Sie kommt nicht ins Protokoll.</p><textarea data-notiz="'+b.id+'" rows="3" placeholder="Eigene Gedanken, Eindrücke, Bewertung">'+esc(no&&no.text)+'</textarea></div>'}
  h+='</div>';
  if(ui.showProt[b.id]){
    h+='<div class="card" id="prot-card"><div class="row between"><h2 style="margin:0">Protokoll</h2><div class="row"><button class="g" data-act="kopieren">Text kopieren</button><button class="g" data-act="mail">E-Mail-Entwurf öffnen</button></div></div><pre id="prot">'+esc(L.protokoll(b,aufg,st.stamm))+'</pre><p class="note">Ohne persönliche Notizen. Kopieren und in die Mail an die Teilnehmer einfügen. Der E-Mail-Knopf funktioniert nicht in jedem Programm.</p></div>';
  }
  return h;
}
function aufgabeZeile(a,lock){
  var c=ctx(),dis=lock?' disabled':'',over=L.ueberfaellig(a,heute());
  return '<div class="task t-'+a.status+'"><input data-af="text" data-a="'+a.id+'" value="'+esc(a.text)+'" placeholder="Was ist zu tun?" aria-label="Aufgabe"'+dis+'>'+
    '<select data-af="wer" data-a="'+a.id+'" aria-label="Verantwortlich"'+dis+'>'+optMa(a.wer,true)+'</select>'+
    '<input type="date" data-af="faellig" data-a="'+a.id+'" value="'+esc(a.faellig||'')+'" class="'+(over?'over':'')+'" aria-label="Fällig"'+dis+'>'+
    stSel(a,L.kannStatusAendern(a,c))+(lock?'<span></span>':'<button class="x" data-del-a="'+a.id+'" title="Aufgabe archivieren">×</button>')+'</div>'+
    '<div class="meta">'+(a.von?'von '+kzB(a.von)+' ':'')+(a.angelegt?'am '+L.de(a.angelegt):'')+mitChips(a,!lock)+(a.text?thrBtn(a):'')+'</div>'+
    (ui.openThr[a.id]?thrPanel(a):'');
}
function stSel(a,can){return '<select class="s-'+a.status+'" data-st="'+a.id+'" aria-label="Status"'+(can?'':' disabled')+'>'+['offen','inarbeit','erledigt'].map(function(s){return '<option value="'+s+'"'+(a.status===s?' selected':'')+'>'+L.stLabel(s)+'</option>'}).join('')+'</select>'}
function mitChips(a,edit){
  var m=a.mit||[],h=m.length?' · beteiligt: '+m.map(function(id){return '<span class="mitc">'+esc(L.kz(nm(id)))+(edit?'<button class="x" data-rmmit="'+a.id+'|'+esc(id)+'" aria-label="entfernen">×</button>':'')+'</span>'}).join(' '):'';
  if(edit)h+=' <select data-mit="'+a.id+'" style="font-size:12px;padding:1px 4px" aria-label="Beteiligte hinzufügen"><option value="">+ beteiligt</option>'+optMa('',false,st.stamm.mitarbeiter.map(function(x){return x.id}).filter(function(id){return id!==a.wer&&m.indexOf(id)<0}))+'</select>';
  return h;
}
function vVorbereitung(b){
  var c=ctx(),gf=leiter(),offen=b.status!=='abgeschlossen',vs=vals(st.vorschl).filter(function(v){return v.besprechung===b.id});
  var mine=vs.filter(function(v){return v.von===c.me}),others=gf?vs.filter(function(v){return v.von!==c.me}):[];
  if(!offen&&!vs.length)return '';
  var h='<div class="prep"><h2>Vorbereitung'+(gf?' · Punkte der Teilnehmer':' · meine Punkte')+'</h2><p class="note" style="margin:-6px 0 10px">'+(gf?'Was die Teilnehmer vorab eingetragen haben. „Als Thema übernehmen“ setzt den Punkt samt Gedanken auf die Tagesordnung.':'Trag vor der Besprechung ein, was du ansprechen willst. Das sehen nur du und die Leitung.')+'</p>';
  others.forEach(function(v){h+='<div class="vp '+(v.uebernommen?'vp-done':'vp-open')+'"><div class="vp-h"><b style="flex:1">'+esc(v.titel||'(ohne Thema)')+'</b><span class="pill p-vp">'+esc(nm(v.von))+'</span>'+(v.uebernommen?'<span class="pill p-erledigt">übernommen</span>':(offen?'<button class="g k" data-vp-take="'+v.id+'">Als Thema übernehmen</button>':''))+'</div>'+(v.text?'<div style="white-space:pre-wrap">'+esc(v.text)+'</div>':'')+'</div>'});
  if(gf&&!others.length)h+='<p class="muted">Noch keine Punkte von Teilnehmern.</p>';
  mine.forEach(function(v){var ro=!offen||v.uebernommen;h+='<div class="vp '+(v.uebernommen?'vp-done':'vp-open')+'"><div class="vp-h"><input data-vp="titel" data-vpid="'+v.id+'" value="'+esc(v.titel)+'" placeholder="Thema, z. B. Fahrzeug für das Service-Team" aria-label="Thema"'+(ro?' disabled':'')+'>'+(v.uebernommen?'<span class="pill p-erledigt">übernommen</span>':'')+(ro?'':'<button class="x" data-del-vp="'+v.id+'" title="Punkt löschen">×</button>')+'</div><textarea data-vp="text" data-vpid="'+v.id+'" rows="2" placeholder="Deine Gedanken dazu" aria-label="Gedanken"'+(ro?' disabled':'')+'>'+esc(v.text)+'</textarea></div>'});

function thrBtn(a){var v=a.verlauf||[],n=v.length,last=n?v[n-1]:null;return ' <button class="g k thr-b'+(last&&last.von!==ctx().me&&!last.sys?' thr-new':'')+'" data-thr="'+a.id+'">'+(ui.openThr[a.id]?'Verlauf schließen':(n?'Verlauf ('+n+')':'Verlauf, Antworten, Fotos'))+'</button>'}

  if(!(a.verlauf||[]).length)h+='<p class="note">Noch keine Einträge. Hier können alle Beteiligten antworten, nachfragen und Fotos anhängen.</p>';

function aufgabenTabelle(list,showWer){

    L.sortiereAufgaben(list,heute()).map(function(a){
      var b=a.besprechung&&findB(a.besprechung),sehe=b&&L.kannSehen(b,c);
      var th=b&&b.themen.find(function(t){return t.id===a.thema});
      var herkunft=(b?(sehe?'<a href="#b-'+b.id+'" data-open="'+b.id+'">'+esc(b.art)+' '+L.de(b.datum)+'</a>':esc(b?'Besprechung '+L.de(b.datum):'')):'direkt vergeben')+'<div class="note">'+(a.von?'von '+kzB(a.von):'')+(a.angelegt?' am '+L.de(a.angelegt):'')+'</div>';
      var arch=a.archiv?'<div class="note" style="color:var(--red)">archiviert am '+L.de(a.archiv.am)+' von '+esc(L.kz(nm(a.archiv.von)))+((c.admin||a.archiv.von===c.me)?' <button class="g k" data-restore="'+a.id+'">wiederherstellen</button>':'')+'</div>':'';
      var kannArch=!a.archiv&&(c.admin||a.von===c.me);

        '<td>'+esc(a.text)+(th&&th.titel?'<div class="note">'+esc(th.titel)+'</div>':'')+(a.notiz?'<div class="note">'+esc(a.notiz)+'</div>':'')+arch+'</td>'+
        (showWer?'<td>'+(a.wer?esc(nm(a.wer)):'<span class="over">niemand</span>')+'<div class="note">'+mitChips(a,!a.archiv&&(c.admin||a.von===c.me))+'</div></td>':'')+

      }).join('')+

/* ---------- Schreibhilfen ---------- */
function stammSpeichern(){speichern('stamm/main',st.stamm,true)}
function bSpeichern(b,sofort){speichern(pfadB(b),b,sofort)}
function aSpeichern(a,sofort){st.aufg[a.id]=a;speichern('aufgaben/'+a.id,a,sofort)}
function laeuft(b){if(b.status==='geplant')b.status='laeuft'}
function neueAufgabe(o){var c=ctx();return Object.assign({id:uid(),text:'',wer:'',mit:[],von:c.me,faellig:'',status:'offen',angelegt:heute(),erledigtAm:'',besprechung:'',thema:'',notiz:'',archiv:null,verlauf:[]},o)}
function sysLog(a,txt){a.verlauf=(a.verlauf||[]).concat([{id:uid(),von:ctx().me,zeit:jetzt(),text:txt,sys:true}])}
function kopieren(text,btn,ok){
  try{navigator.clipboard.writeText(text).then(function(){btn.textContent=ok},function(){btn.textContent='Bitte markieren und kopieren'})}catch(e){btn.textContent='Bitte markieren und kopieren'}
}

/* ---------- Klicks ---------- */
document.addEventListener('click',function(e){
  var t=e.target,b=ui.cur&&findB(ui.cur),c=ctx();
  var nav=t.closest('[data-nav]');if(nav){ui.view=nav.dataset.nav;render();scrollTo(0,0);return}
  var op=t.closest('[data-open]');if(op&&!t.closest('select,button,input,textarea')){e.preventDefault();ui.cur=op.dataset.open;ui.view='detail';render();scrollTo(0,0);return}
  var lb=document.getElementById('lb');if(lb&&t.closest('#lb')){lb.remove();return}
  if(t.dataset.full){var d0=document.createElement('div');d0.id='lb';d0.innerHTML='<img src="'+esc(t.dataset.full)+'" alt="Foto groß">';document.body.appendChild(d0);return}
  var act=t.dataset.act;
  if(act==='einrichten'){
    var abt=$('#e-abt').value.split(',').map(function(x){return x.trim()}).filter(Boolean);
    var ms=L.mitarbeiterAusText($('#e-ma').value,abt);
    abt=abt.concat(ms.map(function(m){return m.abt}).filter(function(a,i,arr){return abt.indexOf(a)<0&&arr.indexOf(a)===i}));
    st.stamm=L.defaultStamm(abt,ms.map(function(m){m.id=uid();return m}));
    var vk=st.stamm.mitarbeiter.find(function(m){return m.rolle==='tl'&&m.abt==='Vertrieb'});
    if(vk)L.artDef(st.stamm,'Verkaufsleitergespräch').fest=[vk.id];
    stammSpeichern();render();setStatus(ms.length+' Mitarbeiter angelegt');return;
  }
  if(act==='claim'){var mid=$('#claim-ma').value;if(!mid){setStatus('Bitte deinen Namen wählen');return}st.konten[env.uid]=Object.assign({},st.konten[env.uid],{ma:mid});speichern('konten/'+env.uid,{ma:mid},true);ui.view='meine';render();return}
  if(act==='neu'){
    var art=$('#n-art').value,person=$('#n-person')?$('#n-person').value:'';
    var nb=L.neueBesprechung({id:uid(),stamm:st.stamm,art:art,abteilung:$('#n-abt')?$('#n-abt').value:'',person:person,titel:$('#n-titel').value.trim(),datum:$('#n-datum').value||heute(),vertraulich:!!($('#n-vert')&&$('#n-vert').checked),me:c.me,neueId:uid});
    (nb.vertraulich?st.geheim:st.bsp)[nb.id]=nb;bSpeichern(nb,true);ui.cur=nb.id;ui.view='detail';render();scrollTo(0,0);return;
  }
  if(act==='zurueck'){ui.view='liste';render();return}
  if(act==='backup'){var js=JSON.stringify({stamm:st.stamm,besprechungen:alleBsp(),aufgaben:alleAufg(),vorschlaege:vals(st.vorschl),stand:jetzt()},null,1);kopieren(js,t,'Kopiert ('+Math.round(js.length/1024)+' KB)');return}
  if(act==='ntask'){
    var tx=$('#nt-text').value.trim();if(!tx){setStatus('Bitte eintragen, was zu tun ist');$('#nt-text').focus();return}
    var na=neueAufgabe({text:tx,wer:$('#nt-wer')?$('#nt-wer').value:c.me,faellig:$('#nt-faellig').value,notiz:$('#nt-notiz').value.trim()});
    aSpeichern(na,true);render();setStatus('Aufgabe für '+nm(na.wer)+' angelegt');return;
  }
  if(t.dataset.rmmit){var rp=t.dataset.rmmit.split('|'),ra=st.aufg[rp[0]];ra.mit=(ra.mit||[]).filter(function(x){return x!==rp[1]});aSpeichern(ra,true);render();return}
  if(t.dataset.thr){ui.openThr[t.dataset.thr]=!ui.openThr[t.dataset.thr];render();return}
  var rw=t.closest('tr[data-row]');if(rw&&!t.closest('select,button,a,input,textarea,label')){ui.openThr[rw.dataset.row]=!ui.openThr[rw.dataset.row];render();return}
  if(t.dataset.unpend){var up=t.dataset.unpend.split('|');ui.pend[up[0]].splice(+up[1],1);render();return}
  if(t.dataset.send){
    var sa=st.aufg[t.dataset.send],txt=(ui.drafts[sa.id]||'').trim(),imgs=ui.pend[sa.id]||[];
    if(!txt&&!imgs.length){setStatus('Bitte Text oder Foto eintragen');return}
    sa.verlauf=(sa.verlauf||[]).concat([{id:uid(),von:c.me,zeit:jetzt(),text:txt,bilder:imgs.slice()}]);ui.drafts[sa.id]='';ui.pend[sa.id]=[];aSpeichern(sa,true);render();return;
  }
  if(t.dataset.delFree){var fa=st.aufg[t.dataset.delFree];fa.archiv={am:heute(),von:c.me};sysLog(fa,'Aufgabe archiviert');aSpeichern(fa,true);render();return}
  if(t.dataset.restore){var ra2=st.aufg[t.dataset.restore];ra2.archiv=null;sysLog(ra2,'Aufgabe wiederhergestellt');aSpeichern(ra2,true);render();return}
  var fc=t.closest('[data-fst]');if(fc){ui.fSt=fc.dataset.fst;render();return}

  if(act==='addabt'){var na2=$('#new-abt').value.trim();if(na2&&st.stamm.abteilungen.indexOf(na2)<0){st.stamm.abteilungen.push(na2);stammSpeichern();render()}return}
  if(act==='addart'){var n2=$('#new-art').value.trim();if(n2&&!st.stamm.arten.some(function(x){return x.name===n2})){st.stamm.arten.push({name:n2,tn:'frei',themen:[]});stammSpeichern();render()}return}
  if(t.dataset.delAbt){st.stamm.abteilungen=st.stamm.abteilungen.filter(function(a){return a!==t.dataset.delAbt});stammSpeichern();render();return}
  if(t.dataset.addma){var inp=document.querySelector('[data-newma="'+t.dataset.addma+'"]'),nmx=inp.value.trim();if(nmx&&!st.stamm.mitarbeiter.some(function(m){return m.name===nmx})){st.stamm.mitarbeiter.push({id:uid(),name:nmx,abt:t.dataset.addma,rolle:'ma'});stammSpeichern();render()}else if(nmx)setStatus('Diesen Namen gibt es schon');return}
  if(!b)return;

  var chip=t.closest('[data-tn]');if(chip&&leiter()&&b.status!=='abgeschlossen'){var m=chip.dataset.tn,s=b.teilnehmer[m]||'';b.teilnehmer[m]=s===''?'a':s==='a'?'e':'';laeuft(b);bSpeichern(b,true);render();return}
  if(act==='vp-neu'){var v0={id:uid(),besprechung:b.id,von:c.me,titel:'',text:'',datum:heute(),uebernommen:false};st.vorschl[v0.id]=v0;speichern('vorschlaege/'+v0.id,v0,true);render();var ins=document.querySelectorAll('[data-vp=titel]');if(ins.length)ins[ins.length-1].focus();return}
  if(t.dataset.delVp){delete st.vorschl[t.dataset.delVp];loeschen('vorschlaege/'+t.dataset.delVp);render();return}
  if(t.dataset.vpTake&&leiter()){var v=st.vorschl[t.dataset.vpTake];b.themen.push({id:uid(),titel:v.titel||'Punkt von '+nm(v.von),notiz:'Vorbereitet von '+nm(v.von)+':\n'+(v.text||''),beschluesse:[],von:v.von});v.uebernommen=true;laeuft(b);speichern('vorschlaege/'+v.id,v,true);bSpeichern(b,true);render();return}
  if(act==='thema'){b.themen.push(L.neuesThema(uid(),''));laeuft(b);bSpeichern(b,true);render();return}
  if(act==='protokoll'){ui.showProt[b.id]=!ui.showProt[b.id];render();var pc=$('#prot-card');if(pc)pc.scrollIntoView({block:'start'});return}
  if(act==='kopieren'){kopieren(L.protokoll(b,alleAufg(),st.stamm),t,'Kopiert');return}
  if(act==='mail'){var p=L.protokoll(b,alleAufg(),st.stamm);location.href='mailto:?subject='+encodeURIComponent('Protokoll '+b.art+' '+L.de(b.datum))+'&body='+encodeURIComponent(p.slice(0,1800));return}
  if(act==='abschliessen'){
    var r=L.abschlussPruefen(b,alleAufg());ui.abschluss[b.id]=r;
    if(r.fehler.length){setStatus('Noch nicht abschließbar');render();return}
    b.status='abgeschlossen';ui.showProt[b.id]=true;bSpeichern(b,true);render();return;
  }
  if(act==='oeffnen'){b.status='laeuft';delete ui.abschluss[b.id];bSpeichern(b,true);render();return}
  if(act==='folge'){var f=L.folgeBesprechung(b,{id:uid(),stamm:st.stamm,me:c.me,heute:heute(),neueId:uid});(f.vertraulich?st.geheim:st.bsp)[f.id]=f;bSpeichern(f,true);ui.cur=f.id;render();scrollTo(0,0);setStatus('Folgetermin angelegt');return}
  function th(id){return b.themen.find(function(x){return x.id===id})}
  if(t.dataset.addD){th(t.dataset.addD).beschluesse.push({id:uid(),text:''});bSpeichern(b,true);render();return}
  if(t.dataset.addA){var aa=neueAufgabe({besprechung:b.id,thema:t.dataset.addA});laeuft(b);aSpeichern(aa,true);bSpeichern(b,true);render();var q2=document.querySelector('[data-a="'+aa.id+'"]');if(q2)q2.focus();return}
  if(t.dataset.delD){var x=th(t.dataset.t),xd=x.beschluesse.find(function(d){return d.id===t.dataset.delD});if(xd&&xd.text){setStatus('Ein Beschluss mit Text wird nicht gelöscht, damit nichts verloren geht');return}x.beschluesse=x.beschluesse.filter(function(d){return d.id!==t.dataset.delD});bSpeichern(b,true);render();return}
  if(t.dataset.delA){var y=st.aufg[t.dataset.delA];if(!y.text){delete st.aufg[y.id];loeschen('aufgaben/'+y.id)}else{y.archiv={am:heute(),von:c.me};sysLog(y,'Aufgabe archiviert');aSpeichern(y,true)}render();return}
  if(t.dataset.delT){var dt=th(t.dataset.delT);if(L.aufgabenDer(b,alleAufg()).some(function(a){return a.thema===dt.id})||dt.beschluesse.some(function(d){return d.text})||(dt.notiz||'').trim()){setStatus('Ein Thema mit Inhalt wird nicht gelöscht, damit nichts verloren geht');return}b.themen=b.themen.filter(function(d){return d.id!==dt.id});bSpeichern(b,true);render();return}

document.addEventListener('keydown',function(e){var f=e.target.closest&&e.target.closest('[data-fst]');if(f&&(e.key==='Enter'||e.key===' ')){e.preventDefault();ui.fSt=f.dataset.fst;render()}if(e.key==='Escape'){var lb=document.getElementById('lb');if(lb)lb.remove()}});

/* ---------- Tippen (gebündelt gespeichert, ohne neu zu zeichnen) ---------- */
document.addEventListener('input',function(e){
  var t=e.target,b=ui.cur&&findB(ui.cur);
  if(t.dataset.rep){ui.drafts[t.dataset.rep]=t.value;return}
  if(t.dataset.notiz){var k='n-'+t.dataset.notiz;st.notizen[k]={text:t.value};speichern('data/users/'+env.uid+'/'+k,st.notizen[k]);return}
  if(t.dataset.rname){st.stamm.rollen[+t.dataset.rname].name=t.value;speichern('stamm/main',st.stamm);return}
  if(t.dataset.vorl){st.stamm.arten[+t.dataset.vorl].themen=t.value.split('\n').map(function(s){return s.trim()}).filter(Boolean);speichern('stamm/main',st.stamm);return}
  if(t.dataset.vp){var v=st.vorschl[t.dataset.vpid];if(v&&v.von===ctx().me){v[t.dataset.vp]=t.value;speichern('vorschlaege/'+v.id,v)}return}
  if(t.dataset.af==='text'){var a=st.aufg[t.dataset.a];a.text=t.value;aSpeichern(a);return}
  if(!b)return;
  if(t.dataset.f&&t.type!=='date'){b[t.dataset.f]=t.value;bSpeichern(b);return}
  if(t.dataset.tf){b.themen.find(function(x){return x.id===t.dataset.t})[t.dataset.tf]=t.value;bSpeichern(b);return}
  if(t.dataset.dec){b.themen.find(function(x){return x.id===t.dataset.t}).beschluesse.find(function(d){return d.id===t.dataset.dec}).text=t.value;bSpeichern(b);return}
});

/* ---------- Auswahlfelder ---------- */
document.addEventListener('change',function(e){
  var t=e.target,b=ui.cur&&findB(ui.cur),c=ctx();
  if(t.id==='f-vorschau'){ui.vorschau=t.value||null;ui.view='liste';render();return}
  if(t.dataset.kma!==undefined||t.dataset.kfrei||t.dataset.kadmin){
    var ku=t.dataset.kma||t.dataset.kfrei||t.dataset.kadmin,k=st.konten[ku],feld={};
    if(t.dataset.kma)feld.ma=t.value||null;if(t.dataset.kfrei)feld.freigegeben=t.checked;if(t.dataset.kadmin)feld.admin=t.checked;
    st.konten[ku]=Object.assign({},k,feld);speichern('konten/'+ku,feld,true);render();return;
  }
  if(t.dataset.mit&&t.value){var am=st.aufg[t.dataset.mit];am.mit=(am.mit||[]).concat([t.value]);aSpeichern(am,true);render();return}
  if(t.dataset.img&&t.files){fotos(t.dataset.img,t.files);return}
  if(t.dataset.st){var a=st.aufg[t.dataset.st];if(!L.kannStatusAendern(a,c))return;aSpeichern(L.statusSetzen(a,t.value,c.me,jetzt()),true);render();return}
  if(t.dataset.af==='wer'||t.dataset.af==='faellig'){var a2=st.aufg[t.dataset.a];a2[t.dataset.af]=t.value;aSpeichern(a2,true);render();return}
  if(t.id==='b-vert'&&b&&c.admin){var alt=pfadB(b);delete (b.vertraulich?st.geheim:st.bsp)[b.id];b.vertraulich=t.checked;(b.vertraulich?st.geheim:st.bsp)[b.id]=b;bSpeichern(b,true);loeschen(alt);render();return}
  if(t.id==='add-tn'&&b&&t.value){b.teilnehmer[t.value]='';bSpeichern(b,true);render();return}
  if(t.dataset.f&&t.type==='date'&&b){b[t.dataset.f]=t.value;bSpeichern(b,true);render();return}
  if(t.id==='n-art'){render();return}
  if(t.id==='f-art'){ui.fArt=t.value;render();return}
  if(t.id==='f-bst'){ui.fBst=t.value;render();return}
  if(t.id==='f-abt'){ui.fAbt=t.value;render();return}
  if(t.dataset.rename){var m=L.ma(st.stamm,t.dataset.rename),nn=t.value.trim();if(!nn||nn===m.name){t.value=m.name;return}if(st.stamm.mitarbeiter.some(function(x){return x.name===nn})){setStatus('Diesen Namen gibt es schon');t.value=m.name;return}m.name=nn;stammSpeichern();render();return}
  if(t.dataset.rolle){L.ma(st.stamm,t.dataset.rolle).rolle=t.value;stammSpeichern();render();return}
  if(t.dataset.perm){var pp=t.dataset.perm.split('|');st.stamm.rollen[+pp[0]].p[pp[1]]=t.value;stammSpeichern();render();return}
  if(t.dataset.mabt){
    var mid=t.dataset.mabt;
    if(t.value==='__del'){var offen=L.entfernenBlockiert(mid,alleAufg());if(offen){setStatus(nm(mid)+' hat noch '+offen+' offene Aufgabe(n). Erst übergeben oder erledigen.');render();return}st.stamm.mitarbeiter=st.stamm.mitarbeiter.filter(function(m){return m.id!==mid})}
    else L.ma(st.stamm,mid).abt=t.value;
    stammSpeichern();render();return;
  }
  if(t.dataset.arttn){st.stamm.arten[+t.dataset.arttn].tn=t.value;stammSpeichern();render();return}
  if(t.dataset.artfest&&t.value){var fa=st.stamm.arten[+t.dataset.artfest];fa.fest=(fa.fest||[]).concat([t.value]);stammSpeichern();render();return}
});

/* ---------- Fotos: verkleinern, dann als Datei ablegen (nicht mehr in der Seite) ---------- */
function fotos(aid,files){
  var fs=[].slice.call(files).filter(function(f){return /^image\//.test(f.type)});
  if(!fs.length){setStatus('Bitte Fotos oder Bilder wählen');return}
  if(!env.assets){setStatus('Fotos hochladen ist hier nicht möglich');return}
  ui.pend[aid]=ui.pend[aid]||[];var left=fs.length;setStatus('Fotos werden hochgeladen …');
  fs.forEach(function(f){verkleinern(f,function(blob){
    env.assets.upload(blob).then(function(r){ui.pend[aid].push(r.url)},function(){setStatus('Ein Foto konnte nicht hochgeladen werden')}).then(function(){if(--left===0){setStatus('Fotos bereit, jetzt „Senden“');render()}});
  })});
}
function verkleinern(file,cb){
  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){var m=1400,sc=Math.min(1,m/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);cv.toBlob(function(b){cb(b||file)},'image/jpeg',0.75)};
  img.onerror=function(){URL.revokeObjectURL(url);cb(file)};img.src=url;
}
document.addEventListener('dragover',function(e){var d=e.target.closest&&e.target.closest('[data-drop]');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',function(e){var d=e.target.closest&&e.target.closest('[data-drop]');if(d)d.classList.remove('over')});
document.addEventListener('drop',function(e){var d=e.target.closest&&e.target.closest('[data-drop]');if(d){e.preventDefault();fotos(d.dataset.drop,e.dataTransfer.files)}else if(e.dataTransfer&&e.dataTransfer.files.length)e.preventDefault()});

ausHash();render();start();
